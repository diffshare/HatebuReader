# cargo-about の設定。配布物に同梱する依存ライブラリのライセンス一覧（THIRD-PARTY-LICENSES.html）を作る。
# ここにないライセンスの依存が入るとリリースを止める。
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
